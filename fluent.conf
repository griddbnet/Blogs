<system>
  workers 2
  # log_level warn   
</system>

# ---- SOURCE: in-memory generator, no disk ----
<source>
  @type sample
  tag stress.griddb
  size 200 # events per second
  rate 50000
  auto_increment_key seq
  dummy {"host":"10.0.0.1","method":"GET","path":"/api/v1/users","code":200,"size":4096,"agent":"gridstress/1.0"}
</source>

# ---- OUTPUT: your existing GridDB block, with a stress-tuned buffer ----
<match stress.griddb>
  @type griddb
    host "https://cloud8737.griddb.com:443"
    cluster "gs_clustermfcloud8737"
    database "6VA6Bl78"
    container "fluentdStress"
    insert_mode "append"
    insert_type "single"
    username "S01VI3dOr0-israel"
    password "israel"

  <buffer>
    @type memory

    # ---- batch size to GridDB (rows per insert request) ----
    chunk_limit_records 50000
    chunk_limit_size    16MB 

    # ---- concurrency to GridDB ----
    flush_thread_count  8        # parallel writers to the Web API. This is where you'll trip gateway 429/503

    # ---- how eagerly to drain ----
    flush_mode          interval
    flush_interval      1s
    flush_thread_interval 0.1

    # ---- absorb spikes / expose backpressure ----
    queued_chunks_limit_size 256
    total_limit_size    4GB   

    # ---- retry behavior: for a stress test, fail fast so drops are visible ----
    retry_max_times     3
    retry_type          periodic
    retry_wait          1s
    overflow_action     throw_exception 
  </buffer>
</match>