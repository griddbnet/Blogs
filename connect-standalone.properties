# Kafka broker
bootstrap.servers=localhost:9092

# How to deserialize messages from Kafka topics
# Since OTel writes OTLP JSON, we use the JSON converter
# schemas.enable=false because OTLP JSON doesn't include a Connect-style schema envelope
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=true

# Where to track consumer offsets for standalone mode
offset.storage.file.filename=/tmp/connect.offsets
offset.flush.interval.ms=10000

# Where to find connector plugins (the directory above the griddb folder)
plugin.path=/Users/israelimru/kafka-plugins

# REST API for managing connectors at runtime (optional but useful)
rest.port=8083
